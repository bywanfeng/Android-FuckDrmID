name: Build FuckDRMID

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
  workflow_dispatch:
    inputs:
      ndk-version:
        description: "Android NDK version to use"
        required: false
        default: "r27c"

permissions:
  contents: read

jobs:
  build:
    name: Build arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ github.event.inputs.ndk-version || 'r27c' }}
          add-to-path: true

      - name: Build with ndk-build
        run: |
          ndk-build NDK_PROJECT_PATH="$GITHUB_WORKSPACE" -j"$(nproc)"

      - name: Show output
        run: |
          ls -la "$GITHUB_WORKSPACE/libs/arm64-v8a/"

      # Optional: if the repo has a module.prop, pack a flashable Magisk/Zygisk module zip
      - name: Pack module zip
        if: hashFiles('module.prop') != ''
        run: |
          set -eux
          mkdir -p module/zygisk
          cp libs/arm64-v8a/libdrmid.so module/zygisk/arm64-v8a.so
          cp module.prop module/
          for f in customize.sh post-fs-data.sh service.sh uninstall.sh; do
            [ -f "$f" ] && cp "$f" module/
          done
          (cd module && zip -qr "../FuckDRMID.zip" .)

      - name: Upload libdrmid.so
        uses: actions/upload-artifact@v4
        with:
          name: libdrmid-arm64-v8a
          path: libs/arm64-v8a/libdrmid.so
          if-no-files-found: error

      - name: Upload module zip
        if: hashFiles('module.prop') != ''
        uses: actions/upload-artifact@v4
        with:
          name: FuckDRMID-module
          path: FuckDRMID.zip
          if-no-files-found: error
