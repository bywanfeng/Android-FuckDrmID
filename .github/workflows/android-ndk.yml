name: Build FuckDRMID

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
  workflow_dispatch:
    inputs:
      ndk-version:
        description: "Android NDK version to use"
        required: false
        default: "r29"

permissions:
  contents: read

jobs:
  build:
    name: Build arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NDK r29 (clang 21): supports -fvisibility-global-new-delete=force-hidden
      # (clang 19+) AND the void* __builtin___clear_cache signature (clang 20+),
      # so the repo builds with zero source changes. r27c/r28 would need edits.
      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ github.event.inputs.ndk-version || 'r29' }}
          add-to-path: true

      # Android.mk / Application.mk live at the repo root (not jni/), so pass
      # APP_BUILD_SCRIPT and NDK_APPLICATION_MK explicitly to ndk-build.
      - name: Build with ndk-build
        run: |
          ndk-build \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE" \
            APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/Android.mk" \
            NDK_APPLICATION_MK="$GITHUB_WORKSPACE/Application.mk" \
            -j"$(nproc)"

      - name: Show output
        run: |
          ls -la "$GITHUB_WORKSPACE/libs/arm64-v8a/"

      # Optional: if the repo has a module.prop, pack a flashable Magisk/Zygisk module zip
      - name: Pack module zip
        if: hashFiles('module.prop') != ''
        run: |
          set -eux
          mkdir -p module/zygisk
          cp libs/arm64-v8a/libdrmid.so module/zygisk/arm64-v8a.so
          cp module.prop module/
          for f in customize.sh post-fs-data.sh service.sh uninstall.sh; do
            [ -f "$f" ] && cp "$f" module/
          done
          (cd module && zip -qr "../FuckDRMID.zip" .)

      - name: Upload libdrmid.so
        uses: actions/upload-artifact@v4
        with:
          name: libdrmid-arm64-v8a
          path: libs/arm64-v8a/libdrmid.so
          if-no-files-found: error

      - name: Upload module zip
        if: hashFiles('module.prop') != ''
        uses: actions/upload-artifact@v4
        with:
          name: FuckDRMID-module
          path: FuckDRMID.zip
          if-no-files-found: error
